[versions]
# Gradle 9 needs the .NET 11 Android workload: .NET 10's builds this project through an init script
# that Gradle 9's Kotlin DSL rejects.
agp = "9.4.1"
# The one InMobi SDK version: the wrapper compiles against it, and the .NET package reads it from
# here to ship the same SDK from Maven (VpnHood.AppLib.Ads.InMobi.Android.csproj).
inmobiAds = "11.4.1"
activity = "1.13.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
material = "1.14.0"

[libraries]
inmobi-ads-kotlin = { module = "com.inmobi.monetization:inmobi-ads-kotlin", version.ref = "inmobiAds" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
